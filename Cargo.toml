[package]
name = "password-manager"
version = "0.1.0"
edition = "2024"

[dependencies]

clap = { version = "4.5.29", features = ["derive"] }
rpassword = "7.2.0"
thiserror = "2.0.10"

tokio = { version = "1.40.0", features = ["full"] }

sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }

async-trait = "0.1.89"